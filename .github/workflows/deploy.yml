name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app (served at the root of app.bgtrainer.korchasa.dev)
        # The marketing landing + privacy/terms now live in the app-store-factory
        # repo and deploy to Cloudflare Pages at bgtrainer.korchasa.dev. This repo
        # only publishes the web app, on its own subdomain (public/CNAME).
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_OUT_DIR: dist

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true   # preserve preview/ subdirectories
