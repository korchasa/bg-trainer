name: Deploy to GitHub Pages

on:
  push:
    tags:
      # Web releases have their own tag namespace, so an unrelated tag never
      # publishes the web app.
      - "web-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Deno is the repository's command runner; npm only installs the builders.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Build web app (served at the root of app.bgtrainer.korchasa.dev)
        # The marketing landing + privacy/terms are hosted outside this
        # repository, on Cloudflare Pages at bgtrainer.korchasa.dev. This repo
        # only publishes the web app, on its own subdomain (public/CNAME).
        run: deno task build
        env:
          VITE_BASE_PATH: /
          VITE_OUT_DIR: dist

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true   # preserve preview/ subdirectories
