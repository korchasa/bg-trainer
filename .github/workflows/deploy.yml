name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app (served at /app/)
        run: npm run build
        env:
          VITE_BASE_PATH: /app/
          VITE_OUT_DIR: dist/app

      - name: Assemble site (landing + policies at root)
        # site/ holds the marketing landing, privacy/terms, CNAME, favicon.
        # Copy it over dist root; the web app already lives in dist/app.
        run: cp -R site/. dist/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true   # preserve preview/ subdirectories
