name: check

# Checks only. This workflow type-checks and builds the web app; it never
# publishes anything. The live web app is deployed by deploy.yml (web-v* tag or
# manual dispatch), and the iOS app is signed and uploaded outside this
# repository.
on:
  pull_request:
  # Branch pushes already build the app in preview.yml, so only main needs its
  # own run here.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A re-push to the same ref makes the previous run obsolete.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `build` is `tsc && vite build`: the type check is the gate, the bundle
      # proves the app still compiles end to end.
      - name: Type-check and build
        run: npm run build
